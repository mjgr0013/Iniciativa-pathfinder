<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172033">
  <title>Iniciativa Pathfinder</title>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Encuentro</p>
        <h1>Rastreador de iniciativa</h1>
      </div>
      <div class="round-panel" aria-live="polite">
        <span>Ronda</span>
        <strong id="round-number">1</strong>
      </div>
      <button id="reset-button" class="button button-danger" type="button">Reiniciar todo</button>
    </header>

    <section class="controls" aria-label="Añadir participante">
      <form id="participant-form" class="participant-form">
        <label>Nombre
          <input id="participant-name" name="name" type="text" autocomplete="off" required>
        </label>
        <label>Iniciativa
          <input id="participant-init" name="initiative" type="number" step="1" value="0" required>
        </label>
        <div class="add-participant-actions">
          <button class="button" type="submit">Añadir activo</button>
          <button id="add-hidden-participant" class="button" type="button">Añadir oculto</button>
        </div>
      </form>
    </section>

    <section>
      <div class="section-heading">
        <h2>Participantes activos</h2>
        <span id="active-count" class="count"></span>
      </div>
      <div id="active-list" class="participant-list"></div>
    </section>

    <section class="hidden-section">
      <button id="hidden-toggle" class="hidden-toggle" type="button" aria-expanded="false" aria-controls="hidden-list">
        <span>Participantes ocultos</span>
        <span id="hidden-count" class="count">0</span>
        <span id="hidden-chevron" aria-hidden="true">▸</span>
      </button>
      <div id="hidden-list" class="participant-list hidden-list" hidden></div>
    </section>
  </main>

  <div class="turn-dock" role="region" aria-label="Control del turno">
    <span class="dock-round">Ronda <strong id="dock-round-number">1</strong></span>
    <span id="current-turn-name" class="dock-current" aria-live="polite">Preparando encuentro…</span>
    <button id="next-button" class="button button-primary" type="button">Siguiente participante <span aria-hidden="true">→</span></button>
  </div>

  <dialog id="reset-dialog">
    <form method="dialog" class="dialog-card">
      <h2>¿Reiniciar el encuentro?</h2>
      <p>Se borrarán los participantes añadidos y las anotaciones. Gorr, Lyra, Caedren, Kumiko y Adriana volverán con iniciativa 0.</p>
      <div class="dialog-actions">
        <button class="button" value="cancel">Cancelar</button>
        <button id="confirm-reset" class="button button-danger" value="confirm">Reiniciar</button>
      </div>
    </form>
  </dialog>

  <template id="participant-template">
    <article class="participant-card">
      <div class="initiative-badge">
        <span>INI</span>
        <button class="initiative-value inline-edit-trigger" type="button" aria-label="Editar iniciativa"></button>
      </div>
      <div class="participant-info">
        <div class="participant-title-row">
          <button class="participant-name inline-edit-trigger" type="button" aria-label="Editar nombre"></button>
          <span class="current-label" hidden>ACTUAL</span>
        </div>
        <div class="annotations"></div>
        <form class="annotation-form" hidden>
          <label class="annotation-text-field">Anotación
            <input name="text" type="text" placeholder="Ej.: ralentizado" required>
          </label>
          <label class="round-input">Duración (rondas)
            <input name="rounds" type="number" min="1" step="1" value="1">
          </label>
          <label class="infinite-label"><input name="infinite" type="checkbox"> Infinita</label>
          <button class="button button-small" type="submit">Guardar anotación</button>
        </form>
      </div>
      <div class="participant-actions">
        <button class="button button-small add-annotation-button" type="button" aria-expanded="false">＋ Anotación</button>
        <button class="button button-small hide-button" type="button">Ocultar</button>
        <button class="button button-small restore-button" type="button" hidden>Mostrar</button>
        <button class="button button-small remove-button" type="button">Eliminar</button>
      </div>
    </article>
  </template>

  <script src="app.js?v=7"></script>
</body>
</html>
